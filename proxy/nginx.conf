# Reverse proxy : seul point d'entrée de la stack (port 80)
server {
    listen 80;
    server_name _;

    # Taille max des fichiers uploadés (PDF, images)
    client_max_body_size 50m;

    # L'API NestJS (le préfixe /api est conservé : le backend l'attend)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # génération IA / export PDF peuvent être longs
    }

    # Documentation Swagger
    location /docs {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # Tout le reste : le frontend
    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
    }
}
