services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"            # SEUL port publié sur la VM
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - exo-net
    restart: unless-stopped

  frontend:
    build: ./frontend-projet/frontend
    networks:
      - exo-net
    restart: unless-stopped

  backend:
    build: ./backend-projet/library-management
    env_file:
      - .env
    environment:
      PORT: 8080
    volumes:
      - exo-uploads:/app/uploads   # fichiers déposés
    networks:
      - exo-net
    restart: unless-stopped

networks:
  exo-net:

volumes:
  exo-uploads:
